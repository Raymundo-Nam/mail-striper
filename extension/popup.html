<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mail Striper</title><link rel="stylesheet" href="popup.css"></head><body>
<header><span class="logo">M</span><strong>Mail Striper</strong></header>
<main><section class="site-card"><div class="site-info"><strong id="site">…</strong><div class="status-line"><span id="dot" class="dot"></span><span id="status">사이트 확인 중</span></div></div><button id="toggle" role="switch" aria-label="이 사이트 보호" aria-checked="false" disabled></button></section>
<div class="stats"><span title="현재 페이지와 접근 가능한 본문 프레임에서 검사한 링크 수. 메뉴 링크도 포함합니다.">검사 링크 <strong id="scanned">—</strong></span><span title="주소 위장 등 의심 패턴이 발견된 링크 수. 클릭하거나 확인한 횟수가 아닙니다.">의심 링크 <strong id="suspicious">—</strong></span><button id="findings" disabled>결과 보기 ↗</button></div>
<details class="sites"><summary>보호 사이트 <span id="site-count">0</span></summary><ul id="site-list"></ul></details><p id="message" role="status"></p></main><script src="popup.js"></script></body></html>
